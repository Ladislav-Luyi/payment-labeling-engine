<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Payment Labeling Engine'">Payment Labeling Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Payment Labeling Engine</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/payments">Payments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/rules">Labeling Rules</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/aggregates">Aggregates</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div th:fragment="content" class="container mt-4">
        <!-- Main content goes here -->
        <h1 th:text="${pageTitle}">Page Title</h1>
        <p>Content placeholder</p>
    </div>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</body>
</html>

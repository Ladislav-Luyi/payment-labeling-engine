<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="base :: head">
    <title th:text="${pageTitle} + ' - Payment Labeling Engine'">Labeling Rules - Payment Labeling Engine</title>
</head>
<body>
    <div th:replace="base :: navbar"></div>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Labeling Rules</li>
            </ol>
        </nav>

        <h1 th:text="${pageTitle}">Labeling Rules</h1>

        <div class="row mb-4">
            <div class="col-md-6">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addLabelModal">Add New Label</button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div th:if="${#lists.isEmpty(labels)}" class="alert alert-info">
                    No labels found.
                </div>
                <div th:if="${not #lists.isEmpty(labels)}" class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="label : ${labels}">
                                <td th:text="${label.id}">1</td>
                                <td th:text="${label.name}">Label Name</td>
                                <td th:text="${label.description}">Description</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Label Modal -->
    <div class="modal fade" id="addLabelModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Label</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="labelName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="labelName" required>
                        </div>
                        <div class="mb-3">
                            <label for="labelDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="labelDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="base :: scripts"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="base :: head">
    <title th:text="${pageTitle} + ' - Payment Labeling Engine'">Aggregates - Payment Labeling Engine</title>
</head>
<body>
    <div th:replace="base :: navbar"></div>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Aggregates</li>
            </ol>
        </nav>

        <h1 th:text="${pageTitle}">Aggregates</h1>

        <div class="row mb-4">
            <div class="col-md-6">
                <form method="post" action="/aggregates/recalculate" class="d-flex align-items-end" style="gap: 0.5rem;">
                    <div>
                        <label for="recalcPeriodEndDay" class="form-label mb-1">Period End Day</label>
                        <input id="recalcPeriodEndDay" type="number" class="form-control" name="periodEndDay" th:value="${periodEndDay}" placeholder="1-31" min="1" max="31">
                    </div>
                    <button type="submit" class="btn btn-success mt-3">
                        <i class="bi bi-arrow-clockwise"></i> Recalculate Aggregates
                    </button>
                </form>
            </div>
            <div class="col-md-6">
                <form class="d-flex" method="get" action="/aggregates">
                    <input type="number" class="form-control me-2" name="year" th:value="${year}" placeholder="Year">
                    <input type="number" class="form-control me-2" name="month" th:value="${month}" placeholder="Month (1-12)">
                    <input type="number" class="form-control me-2" name="periodEndDay" th:value="${periodEndDay}" placeholder="Period End Day (1-31)" min="1" max="31">
                    <button class="btn btn-outline-primary" type="submit">Filter</button>
                    <a href="/aggregates" class="btn btn-outline-secondary ms-2">Clear</a>
                </form>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
            <span th:text="${info}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div th:if="${#lists.isEmpty(aggregates)}" class="alert alert-info">
                    No aggregates found. Click "Recalculate Aggregates" to generate aggregates from payment labels.
                </div>
                <div th:if="${not #lists.isEmpty(aggregates)}" class="accordion" id="aggregatesAccordion">
                    <div class="accordion-item" th:each="aggregate, stat : ${aggregates}">
                        <h2 class="accordion-header" th:id="'heading' + ${aggregate.id}">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:attr="data-bs-target='#collapse' + ${aggregate.id}">
                                <div class="flex-grow-1">
                                    <div>
                                        <strong>Month:</strong> <span th:text="${aggregate.month}">1</span>/<span th:text="${aggregate.year}">2023</span>
                                        <span th:if="${aggregate.periodEndDay != null}">
                                            &nbsp;&nbsp;<strong>Period End Day:</strong> <span th:text="${aggregate.effectivePeriodEndDay}">15</span>
                                        </span>
                                        &nbsp;&nbsp;
                                        <strong>Labels:</strong>
                                        <span th:each="label, iterStat : ${aggregate.labelsSorted}">
                                            <span class="badge bg-secondary" th:text="${label.name}">Label</span><span th:unless="${iterStat.last}">&nbsp;</span>
                                        </span>
                                    </div>
                                    <div class="mt-2">
                                        <small class="text-muted">
                                            <strong>Total Amount:</strong> <span th:text="'€' + ${#numbers.formatDecimal(aggregate.totalAmount, 1, 2)}">€0.00</span>
                                            &nbsp;&nbsp;
                                            <strong>Transactions:</strong> <span th:text="${aggregate.transactionCount}">0</span>
                                        </small>
                                    </div>
                                </div>
                            </button>
                        </h2>
                        <div th:id="'collapse' + ${aggregate.id}" class="accordion-collapse collapse" th:attr="data-bs-parent='#aggregatesAccordion'">
                            <div class="accordion-body">
                                <!-- Payments table for this aggregate -->
                                <div class="table-responsive">
                                    <table class="table table-sm table-hover">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Payment ID</th>
                                                <th>Date</th>
                                                <th>Amount</th>
                                                <th>Reference</th>
                                                <th>Counterparty</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <!-- Note: Payments will be loaded dynamically via AJAX -->
                                            <tr>
                                                <td colspan="5" class="text-center">
                                                    <small class="text-muted">Click "Load Payments" to view detailed payment information</small>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-outline-primary" type="button" th:attr="onclick='loadPayments(' + ${aggregate.id} + ')'">
                                        Load Payments
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="base :: scripts"></div>

    <script>
        function loadPayments(aggregateId) {
            // Make AJAX call to fetch payments for this aggregate
            fetch('/api/aggregates/' + aggregateId + '/payments')
                .then(response => response.json())
                .then(payments => {
                    // Find the table body for this aggregate
                    const tbody = document.querySelector('#collapse' + aggregateId + ' tbody');
                    tbody.innerHTML = '';

                    if (payments.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No payments found</td></tr>';
                        return;
                    }

                    payments.forEach(payment => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${payment.id}</td>
                            <td>${payment.paymentDate}</td>
                            <td>€${parseFloat(payment.amount).toFixed(2)}</td>
                            <td>${payment.reference || '-'}</td>
                            <td>${payment.counterpartyName || '-'}</td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error loading payments:', error);
                    alert('Failed to load payments');
                });
        }
    </script>
</body>
</html>

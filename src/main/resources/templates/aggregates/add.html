<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="base :: head">
    <title th:text="${pageTitle} + ' - Payment Labeling Engine'">Add Aggregate - Payment Labeling Engine</title>
</head>
<body>
    <div th:replace="base :: navbar"></div>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="/aggregates">Aggregates</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add</li>
            </ol>
        </nav>

        <h1 th:text="${pageTitle}">Add Aggregate</h1>

        <!-- Error Messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Create New Aggregate</h5>
                        <form method="post" action="/aggregates">
                            <div class="mb-3">
                                <label for="labelId" class="form-label">Label</label>
                                <select class="form-select" id="labelId" name="labelId" required>
                                    <option value="">Select a label</option>
                                    <option th:each="label : ${labels}" th:value="${label.id}" th:text="${label.name}">Label Name</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="year" class="form-label">Year</label>
                                <input type="number" class="form-control" id="year" name="year" required min="2000" max="2100">
                            </div>
                            <div class="mb-3">
                                <label for="month" class="form-label">Month</label>
                                <input type="number" class="form-control" id="month" name="month" required min="1" max="12">
                            </div>
                            <div class="mb-3">
                                <label for="totalAmount" class="form-label">Total Amount</label>
                                <input type="number" class="form-control" id="totalAmount" name="totalAmount" step="0.01" required>
                            </div>
                            <div class="mb-3">
                                <label for="transactionCount" class="form-label">Transaction Count</label>
                                <input type="number" class="form-control" id="transactionCount" name="transactionCount" required min="0">
                            </div>
                            <button type="submit" class="btn btn-primary">Create Aggregate</button>
                            <a href="/aggregates" class="btn btn-secondary ms-2">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="base :: scripts"></div>
</body>
</html>

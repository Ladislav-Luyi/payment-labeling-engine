spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/payment_labeling_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.paymentlabeling: DEBUG
    org.springframework.web: DEBUG

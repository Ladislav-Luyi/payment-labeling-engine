version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-labeling-postgres
    environment:
      POSTGRES_DB: payment_labeling_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-labeling-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-labeling-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_labeling_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payment-labeling-network

volumes:
  postgres_data:

networks:
  payment-labeling-network:
    driver: bridge

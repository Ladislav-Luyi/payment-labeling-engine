version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-labeling-postgres
    environment:
      POSTGRES_DB: payment_labeling_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-labeling-network


networks:
  payment-labeling-network:
    driver: bridge
